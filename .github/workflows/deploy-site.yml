# Publica o front (S3 + CloudFront) a cada push na main.
#
# Variáveis do repositório (Settings > Secrets and variables > Actions >
# Variables), valores tirados do `terraform output` em infra/:
#   AWS_ROLE_ARN             -> github_deploy_role_arn
#   SITE_BUCKET              -> site_bucket
#   SITE_DISTRIBUTION_ID     -> site_distribution_id
name: Deploy do site

on:
  push:
    branches: [main]
    # Mudanças só na infra, nas Lambdas ou no README não mexem no site.
    paths-ignore:
      - "infra/**"
      - "lambdas/**"
      - "README.md"

# Necessário para o GitHub emitir o token OIDC (id-token) e para o checkout.
permissions:
  id-token: write
  contents: read

# Dois pushes seguidos: o segundo espera o primeiro terminar, sem cancelar.
concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      # Troca o token OIDC do GitHub por credenciais temporárias da role.
      - name: Assumir a role na AWS
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --delete apaga do bucket o que não existe mais no repositório.
      - name: Enviar arquivos para o S3
        run: |
          aws s3 sync . "s3://${{ vars.SITE_BUCKET }}" \
            --delete \
            --exclude "infra/*" \
            --exclude "lambdas/*" \
            --exclude ".git/*" \
            --exclude ".github/*" \
            --exclude ".gitignore" \
            --exclude "README.md"

      # Faz o CloudFront buscar os arquivos novos em vez de servir o cache.
      - name: Invalidar o cache do CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" \
            --paths "/*"
