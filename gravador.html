<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Gravação | Sprint Laser</title>
	<meta name="theme-color" content="#000000">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Big+Shoulders+Display:wght@800;900&display=swap" rel="stylesheet">
	<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
	<!-- EVENTO DUPLO: faixa fixa no topo enquanto a Corrida B estiver selecionada. -->
	<div class="race-banner" id="race-banner" hidden>Corrida B</div>
	<div class="topbar-wrap">
		<header class="shell shell-wide topbar">
			<a class="brand" href="index.html" aria-label="Sprint Laser">SPRINT<br>LASER</a>
			<a class="back-link" href="index.html">Início</a>
		</header>
	</div>
	<main class="shell shell-wide">
		<h1>Encontre<br>o corredor.</h1>
		<p class="intro">Digite o número da camisa do corredor para conferir os dados da gravação.</p>
		<form id="search-form" novalidate>
			<!-- EVENTO DUPLO: escolhe em qual corrida buscar. A Corrida A é a de sempre;
			     a B busca a camisa com o prefixo "B-" (quem se cadastrou pelo QR code ?e=b). -->
			<!-- MUDANÇA: eram dois botões lado a lado; virou uma caixa de seleção, que não troca
			     de corrida com um toque sem querer (precisa abrir a lista e escolher). -->
			<label class="field race-select"><span class="field-label">Corrida</span><select id="race" name="corrida"><option value="a">Corrida A</option><option value="b">Corrida B</option></select></label>
			<div class="search-row">
				<!-- MUDANÇA: a busca era pelo código sequencial (2 dígitos); agora é pelo número da camisa (até 6). -->
				<label class="field"><span class="field-label">Número da camisa</span><input id="runner-bib" inputmode="numeric" autocomplete="off" maxlength="6" placeholder="150" required></label>
				<button class="button" type="submit">Buscar</button>
			</div>
			<p class="status" id="search-status" role="alert"></p>
		</form>
		<section class="runner-card" id="runner-card" aria-live="polite">
			<p class="card-label">Gravar na medalha:</p>
			<h2 class="runner-name" id="runner-name"></h2>
			<p class="runner-time" id="runner-time"></p>
		</section>
	</main>
	<footer class="shell shell-wide">Sprint Laser, produção em movimento</footer>
	<script src="config.js"></script>
	<script>
		// Busca o corredor na API. Devolve { nome, tempo }, ou null se a API
		// responder 404. Outros erros viram Error; falha de rede vira TypeError (do fetch).
		// MUDANÇA: busca pelo número da camisa. Zeros à esquerda podem ser enviados;
		// a API normaliza ("0150" encontra a camisa 150).
		async function buscarCorredor(numeroCamisa) {
			const resposta = await fetch(`${API_URL}/corredor/${encodeURIComponent(numeroCamisa)}`);
			if (resposta.status === 404) return null;
			if (!resposta.ok) throw new Error("Não foi possível buscar o corredor. Tente novamente.");
			return resposta.json();
		}

		const form = document.querySelector("#search-form");
		const input = document.querySelector("#runner-bib");
		const status = document.querySelector("#search-status");
		const card = document.querySelector("#runner-card");
		const name = document.querySelector("#runner-name");
		const time = document.querySelector("#runner-time");
		const raceBanner = document.querySelector("#race-banner");
		const raceSelect = document.querySelector("#race");

		// EVENTO DUPLO: corrida escolhida no seletor. Fica salva no localStorage para as
		// próximas buscas e para quando a página for recarregada. Sem nada salvo, é a A.
		const CHAVE_CORRIDA = "sprintlaser.corrida";
		const corridaB = () => raceSelect.value === "b";
		const naoEncontrado = () => `Não encontramos um corredor com esse número de camisa${corridaB() ? " na Corrida B" : ""}.`;

		try {
			if (localStorage.getItem(CHAVE_CORRIDA) === "b") raceSelect.value = "b";
		} catch { /* localStorage bloqueado: fica na Corrida A */ }
		// Faixa no topo e caixa vermelha quando a Corrida B está ativa.
		function mostrarCorrida() {
			raceBanner.hidden = !corridaB();
			raceSelect.classList.toggle("is-b", corridaB());
		}
		mostrarCorrida();

		raceSelect.addEventListener("change", () => {
			try { localStorage.setItem(CHAVE_CORRIDA, raceSelect.value); } catch { /* só não lembra */ }
			mostrarCorrida();
			// O corredor na tela era da outra corrida: limpa para não gravar o errado.
			card.classList.remove("is-visible");
			status.textContent = "";
		});

		form.addEventListener("submit", async (event) => {
			event.preventDefault();
			const numeroCamisa = input.value.trim();
			card.classList.remove("is-visible");
			if (!/^\d{1,6}$/.test(numeroCamisa)) {
				status.textContent = naoEncontrado();
				return;
			}
			status.textContent = "";
			try {
				const corredor = await buscarCorredor(corridaB() ? `B-${numeroCamisa}` : numeroCamisa);
				if (!corredor) {
					status.textContent = naoEncontrado();
					return;
				}
				name.textContent = corredor.nome;
				time.textContent = corredor.tempo;
				card.classList.add("is-visible");
			} catch (erro) {
				status.textContent = erro instanceof TypeError
					? "Não conseguimos conectar. Verifique sua internet e tente novamente."
					: erro.message;
			}
		});
	</script>
</body>
</html>
